name: Validate Rules

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Rule structure & smoke tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # No dependency install: validate-rules.mjs is deliberately dependency-free, so a bad rule is
      # caught in the repository that owns it rather than after it has been vendored into several
      # projects.
      - name: Validate Rule Structure
        run: node bin/validate-rules.mjs

      # The smoke tests live in tests/smoke.sh, not inline here, so the same command runs on a
      # developer's machine and on CI. Inline steps could only be run by pushing, which is how the
      # two bugs those steps were written to catch got in.
      - name: Smoke Tests
        run: bash tests/smoke.sh
